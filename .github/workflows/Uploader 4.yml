name: Uploader V4

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: 'Magnet Link or Direct Download URL'
        required: true

      remote_name:
        description: 'The name of the remote in your rclone.conf'
        required: true
        default: 'gdrive'

      zip_mode:
        description: 'Upload Mode'
        required: true
        type: choice
        default: normal
        options:
          - normal
          - zip

      link_sharing:
        description: 'Share uploaded Google Drive files?'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 rclone zip

      - name: Download
        shell: bash
        run: |
          mkdir -p downloads

          INPUT="${{ github.event.inputs.magnet_link }}"

          if [[ "$INPUT" == magnet:* ]]; then
            echo "Detected Magnet Link"

            aria2c \
              --seed-time=0 \
              --summary-interval=5 \
              --dir=downloads \
              --bt-max-peers=120 \
              --file-allocation=falloc \
              "$INPUT"

          else
            echo "Detected Direct URL"

            # Extract filename from URL (removes ?download=true)
            FILENAME=$(basename "${INPUT%%\?*}")

            echo "Saving as: $FILENAME"

            aria2c \
              --dir=downloads \
              --out="$FILENAME" \
              --continue=true \
              --auto-file-renaming=false \
              --content-disposition-default-utf8=true \
              "$INPUT"
          fi

      - name: Show Downloaded Files
        run: |
          echo "Downloaded files:"
          ls -lah downloads

      - name: Compress Files (Optional)
        if: ${{ github.event.inputs.zip_mode == 'zip' }}
        run: |
          mkdir -p upload
          zip -r upload/archive.zip downloads

      - name: Prepare Normal Upload
        if: ${{ github.event.inputs.zip_mode == 'normal' }}
        run: |
          mkdir -p upload
          cp -r downloads/. upload/

      - name: Upload via Rclone
        run: |
          echo "Starting Upload..."

          rclone --config ./rclone.conf copy ./upload/ "${{ github.event.inputs.remote_name }}:Downloads/" \
            --progress \
            --drive-chunk-size 128M \
            --transfers 8 \
            --checkers 16 \
            --fast-list

      - name: Done
        run: echo "Upload Complete!"
