name: Link2Drive

on:
  push:
    branches: [main]
    paths: [links.txt]
  workflow_dispatch:
    inputs:
      url:
        description: "Direct HTTP(S) URL or magnet link (leave blank to process links.txt)"
        required: false
        type: string
      zip:
        description: "Compress all downloaded files into one ZIP"
        required: false
        default: false
        type: boolean
      share:
        description: "Create anyone-with-link viewer links"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: link2drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install aria2 and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare input links
        env:
          SINGLE_URL: ${{ inputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            BEFORE="$(jq -r '.before' "$GITHUB_EVENT_PATH")"
            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              git show "$GITHUB_SHA:links.txt" > input.txt
            else
              git diff --unified=0 "$BEFORE" "$GITHUB_SHA" -- links.txt |
                sed -n '/^+++ /d; /^+[^+]/s/^+//p' > input.txt
            fi
          elif [[ -n "$SINGLE_URL" ]]; then
            printf '%s\n' "$SINGLE_URL" > input.txt
          elif [[ -f links.txt ]]; then
            cp links.txt input.txt
          else
            : > input.txt
          fi
          if ! grep -qE '^[[:space:]]*[^#[:space:]]' input.txt; then
            echo "No links to process."
            exit 1
          fi

      - name: Download and upload to Google Drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          INPUT_FILE: input.txt
          ZIP_MODE: ${{ inputs.zip }}
          SHARE_LINKS: ${{ inputs.share }}
        run: python uploader.py
