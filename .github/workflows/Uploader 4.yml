name: Uploader V4

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: 'Magnet Link or Direct Download URL'
        required: true

      remote_name:
        description: 'The name of the remote in your rclone.conf'
        required: true
        default: 'gdrive'

      zip_mode:
        description: 'Upload Mode'
        required: true
        type: choice
        default: normal
        options:
          - normal
          - zip

      link_sharing:
        description: 'Share uploaded Google Drive files?'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 rclone zip jq

      - name: Download
        shell: bash
        run: |
          mkdir -p downloads

          INPUT="${{ github.event.inputs.magnet_link }}"

          if [[ "$INPUT" == magnet:* ]]; then
            echo "Detected Magnet Link"

            aria2c \
              --seed-time=0 \
              --summary-interval=5 \
              --dir=downloads \
              --bt-max-peers=120 \
              --file-allocation=falloc \
              "$INPUT"

          else
            echo "Detected Direct URL"

            FILENAME=$(basename "${INPUT%%\?*}")
            echo "Saving as: $FILENAME"

            aria2c \
              --dir=downloads \
              --out="$FILENAME" \
              --continue=true \
              --auto-file-renaming=false \
              --content-disposition-default-utf8=true \
              "$INPUT"
          fi

          # Determine the actual top-level name of what was downloaded
          # (a single file, or a single torrent folder)
          ENTRY_COUNT=$(find downloads -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ENTRY_COUNT" -eq 1 ]; then
            BASE_NAME=$(basename "$(find downloads -mindepth 1 -maxdepth 1)")
          else
            # Multiple top-level items (rare for magnets with loose files) —
            # fall back to a generic name
            BASE_NAME="Downloads"
          fi

          # Strip the extension if it's a single file, so archive gets a clean name
          if [ -f "downloads/$BASE_NAME" ]; then
            NAME_NO_EXT="${BASE_NAME%.*}"
          else
            NAME_NO_EXT="$BASE_NAME"
          fi

          echo "Detected name: $NAME_NO_EXT"
          echo "UPLOAD_NAME=$NAME_NO_EXT" >> "$GITHUB_ENV"

      - name: Show Downloaded Files
        run: |
          echo "Downloaded files:"
          ls -lah downloads
          echo "Upload name will be: $UPLOAD_NAME"

      - name: Compress Files (Optional)
        if: ${{ github.event.inputs.zip_mode == 'zip' }}
        run: |
          mkdir -p upload
          zip -r "upload/${UPLOAD_NAME}.zip" downloads

      - name: Prepare Normal Upload
        if: ${{ github.event.inputs.zip_mode == 'normal' }}
        run: |
          mkdir -p upload
          cp -r downloads/. upload/

      - name: Upload via Rclone
        run: |
          echo "Starting Upload..."

          rclone --config ./rclone.conf copy ./upload/ "${{ github.event.inputs.remote_name }}:Downloads/" \
            --progress \
            --drive-chunk-size 128M \
            --transfers 8 \
            --checkers 16 \
            --fast-list

      - name: Share & Shorten Link
        if: ${{ github.event.inputs.link_sharing == 'true' }}
        run: |
          set -e

          if [ "${{ github.event.inputs.zip_mode }}" == "zip" ]; then
            TARGET_PATH="Downloads/${UPLOAD_NAME}.zip"
          else
            FILE_COUNT=$(find upload -maxdepth 1 -type f | wc -l)
            if [ "$FILE_COUNT" -eq 1 ]; then
              FILE_NAME=$(find upload -maxdepth 1 -type f -printf "%f\n")
              TARGET_PATH="Downloads/$FILE_NAME"
            else
              TARGET_PATH="Downloads"
            fi
          fi

          echo "Sharing: ${{ github.event.inputs.remote_name }}:$TARGET_PATH"

          rclone --config ./rclone.conf link "${{ github.event.inputs.remote_name }}:$TARGET_PATH" > gdrive_link.txt
          FINAL_URL=$(cat gdrive_link.txt)

          echo "Google Drive Link: $FINAL_URL"

          RESPONSE=$(curl -s -X POST https://api.shrinkrl.com/api/v1/urls \
            -H "Content-Type: application/json" \
            -d "{\"url\":{\"original_url\":\"$FINAL_URL\"}}")

          SHORT_URL=$(echo "$RESPONSE" | jq -r '.short_url')

          echo "Short URL: $SHORT_URL"

          {
            echo "### 🔗 Upload Links"
            echo ""
            echo "**Name:** $UPLOAD_NAME"
            echo ""
            echo "**Final Google Drive URL:**"
            echo "$FINAL_URL"
            echo ""
            echo "**Short URL:**"
            echo "$SHORT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Done
        run: echo "Upload Complete!"
