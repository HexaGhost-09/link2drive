name: Build and publish Uploader V5.1 binary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux x86_64 release binary
        run: cargo build --release --manifest-path uploader-v5/Cargo.toml

      - name: Prepare release asset and checksum
        run: |
          set -euo pipefail
          install -m 0755 uploader-v5/target/release/link2drive-stream link2drive-stream-linux-x86_64
          sha256sum link2drive-stream-linux-x86_64 > SHA256SUMS.txt

      - name: Publish V5.1.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.1.0
          target_commitish: main
          name: Link2Drive Uploader V5.1.0
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            link2drive-stream-linux-x86_64
            SHA256SUMS.txt
