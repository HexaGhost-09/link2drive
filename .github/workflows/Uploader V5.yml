name: Uploader V5 - Direct URL Streaming

on:
  workflow_dispatch:
    inputs:
      direct_url:
        description: "Direct HTTP/HTTPS download URL"
        required: true
        type: string
      remote_name:
        description: "Name of the rclone remote (must exist in RCLONE_CONFIG_CONTENT)"
        required: true
        default: "gdrive"
        type: string
      filename:
        description: "Optional output filename (leave empty to detect automatically)"
        required: false
        type: string
      link_sharing:
        description: "Generate a share link after upload?"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rclone
        run: |
          curl --fail --silent --show-error https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone securely
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_CONTENT }}
          REMOTE_NAME: ${{ inputs.remote_name }}
        run: |
          set -euo pipefail
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone.conf"
          echo "RCLONE_CONFIG=$RCLONE_CONFIG" >> "$GITHUB_ENV"
          if [ -z "${RCLONE_CONFIG_CONTENT}" ]; then
            echo "::error::Add a repository Actions secret named RCLONE_CONFIG_CONTENT containing your rotated rclone.conf."
            exit 1
          fi
          umask 077
          printf '%s' "$RCLONE_CONFIG_CONTENT" > "$RCLONE_CONFIG"
          chmod 600 "$RCLONE_CONFIG"
          rclone listremotes | grep -Fx "${REMOTE_NAME}:" >/dev/null || {
            echo "::error::Remote '${REMOTE_NAME}' was not found in RCLONE_CONFIG_CONTENT."
            exit 1
          }

      - name: Build Rust streaming uploader
        run: cargo build --release --manifest-path uploader-v5/Cargo.toml

      - name: Stream direct URL to cloud remote
        id: upload
        env:
          DIRECT_URL: ${{ inputs.direct_url }}
          REMOTE_NAME: ${{ inputs.remote_name }}
          OUTPUT_FILENAME: ${{ inputs.filename }}
        run: |
          set -euo pipefail
          ./uploader-v5/target/release/link2drive-stream \
            "$DIRECT_URL" "$REMOTE_NAME" "$OUTPUT_FILENAME"

      - name: Generate share link
        if: ${{ inputs.link_sharing == 'true' }}
        env:
          TARGET: ${{ steps.upload.outputs.target }}
          FILENAME: ${{ steps.upload.outputs.filename }}
        run: |
          set -euo pipefail
          LINK="$(rclone link "$TARGET")"
          {
            echo "### Upload complete"
            echo ""
            echo "**File:** $FILENAME"
            echo ""
            echo "**Google Drive link:**"
            echo "$LINK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        if: ${{ inputs.link_sharing != 'true' }}
        env:
          TARGET: ${{ steps.upload.outputs.target }}
          FILENAME: ${{ steps.upload.outputs.filename }}
        run: |
          {
            echo "### Upload complete"
            echo ""
            echo "**File:** $FILENAME"
            echo ""
            echo "**Remote path:** `$TARGET`"
          } >> "$GITHUB_STEP_SUMMARY"
